# ScalaGBM 配置文件模板 (Configuration File Template)
# 此文件包含了所有可配置的参数及其说明
# This file contains all configurable parameters and their descriptions

# ============================================================================
# 数据配置 (Data Configuration)
# ============================================================================

# 训练数据路径 (Training data path)
# 支持LibSVM格式的数据文件 (Supports LibSVM format data files)
data=dataset/your_dataset.txt

# ============================================================================
# 基础模型参数 (Basic Model Parameters)
# ============================================================================

# 目标函数 (Objective function)
# 可选值 (Options): 
#   - binary:logistic    : 二分类逻辑回归 (Binary logistic regression)
#   - multi:softmax      : 多分类 (Multi-class classification)
#   - multi:softprob     : 多分类概率输出 (Multi-class with probability output)
#   - reg:linear         : 线性回归 (Linear regression)
#   - reg:logistic       : 逻辑回归 (Logistic regression)
objective=binary:logistic

# 类别数量 (Number of classes)
# 二分类设置为2，多分类设置为实际类别数，回归设置为1
# Binary: 2, Multi-class: actual number of classes, Regression: 1
num_class=2

# ============================================================================
# 树结构参数 (Tree Structure Parameters)
# ============================================================================

# 树的最大深度 (Maximum tree depth)
# 范围: 1-20, 推荐: 3-10 (Range: 1-20, Recommended: 3-10)
# 过深容易过拟合 (Too deep may cause overfitting)
depth=6

# 迭代轮数/树的数量 (Number of iterations/trees)
# 范围: 1-无穷, 推荐: 50-500 (Range: 1-∞, Recommended: 50-500)
n_trees=100

# 树构建方法 (Tree building method)
# 可选值 (Options):
#   - hist  : 基于直方图，速度快 (Histogram-based, fast)
#   - exact : 精确方法，精度高但慢 (Exact method, accurate but slow)
#   - auto  : 自动选择 (Auto selection)
tree_method=hist

# ============================================================================
# 学习参数 (Learning Parameters)
# ============================================================================

# 学习率 (Learning rate)
# 范围: 0.01-1.0, 推荐: 0.05-0.3 (Range: 0.01-1.0, Recommended: 0.05-0.3)
# 较小的学习率需要更多的树 (Smaller learning rate requires more trees)
learning_rate=0.1

# ============================================================================
# 正则化参数 (Regularization Parameters)
# ============================================================================

# L2正则化参数 (L2 regularization parameter)
# 范围: 0-无穷, 推荐: 0.1-10 (Range: 0-∞, Recommended: 0.1-10)
# 增大可以防止过拟合 (Increase to prevent overfitting)
lambda=1.0

# 最小分割损失 (Minimum split loss)
# 范围: 0-无穷, 推荐: 0-1 (Range: 0-∞, Recommended: 0-1)
# 增大可以使模型更保守 (Increase to make model more conservative)
gamma=0.0

# 子节点最小权重 (Minimum child weight)
# 范围: 0-无穷, 推荐: 1-10 (Range: 0-∞, Recommended: 1-10)
# 增大可以防止过拟合 (Increase to prevent overfitting)
min_child_weight=1

# ============================================================================
# 内存和性能参数 (Memory and Performance Parameters)
# ============================================================================

# 直方图最大分桶数 (Maximum number of histogram bins)
# 范围: 2-1024, 推荐: 64-255 (Range: 2-1024, Recommended: 64-255)
# 影响内存使用和训练精度 (Affects memory usage and training accuracy)
max_num_bin=255

# 使用的GPU数量 (Number of GPUs to use)
# 范围: 1-可用GPU数 (Range: 1-available GPUs)
n_gpus=1

# ============================================================================
# 采样参数 (Sampling Parameters)
# ============================================================================

# 列采样率 (Column sampling rate)
# 范围: 0.1-1.0, 推荐: 0.6-1.0 (Range: 0.1-1.0, Recommended: 0.6-1.0)
# 减少可以防止过拟合并提高速度 (Reduce to prevent overfitting and improve speed)
column_sampling_rate=1.0

# 是否使用Bagging (Whether to use bagging)
# 0: 不使用 (No), 1: 使用 (Yes)
bagging=0

# 并行树数量 (Number of parallel trees)
# 通常设置为1 (Usually set to 1)
n_parallel_trees=1

# ============================================================================
# 日志和调试参数 (Logging and Debug Parameters)
# ============================================================================

# 日志详细程度 (Verbose level)
# 0: 静默 (Silent), 1: 基本信息 (Basic), 2: 详细信息 (Detailed)
verbose=1

# 性能分析 (Performance profiling)
# 0: 关闭 (Off), 1: 开启 (On)
profiling=0

# ============================================================================
# 示例配置 (Example Configurations)
# ============================================================================

# 以下是一些常用的配置组合示例 (Common configuration examples):

# 1. 快速训练配置 (Fast training configuration)
# tree_method=hist
# max_num_bin=128
# depth=4
# learning_rate=0.2
# n_trees=50

# 2. 高精度配置 (High accuracy configuration)
# tree_method=exact
# max_num_bin=255
# depth=8
# learning_rate=0.05
# n_trees=200
# lambda=2.0

# 3. 内存优化配置 (Memory optimized configuration)
# max_num_bin=64
# depth=4
# column_sampling_rate=0.6
# n_gpus=1
# learning_rate=0.15

# 4. 大数据集配置 (Large dataset configuration)
# tree_method=hist
# max_num_bin=128
# column_sampling_rate=0.8
# bagging=1
# n_gpus=2